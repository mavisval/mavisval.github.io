cv:
  name: Zhongxin Hu
  label: PhD Candidate in Operations Management
  email: z.hu1@tue.nl
  location: Eindhoven, The Netherlands
  image: ""
  summary: "My research focuses on sustainable operations and supply chain management. I study how firms can design circular business models, such as remanufacturing and refurbishment, as well as other operational strategies that create economic value while improving environmental and societal outcomes. My work primarily uses analytical modeling and optimization. My broader research interests include pricing and equilibrium analysis in queueing systems and sequential games."

